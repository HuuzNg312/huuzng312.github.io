    <path d="M150 318H270" stroke="#07111f" stroke-width="14" stroke-linecap="round" opacity=".8"/>
    <circle cx="125" cy="384" r="12" fill="#72e3a2"/>
    <circle cx="210" cy="404" r="12" fill="#72e3a2"/>
    <circle cx="295" cy="384" r="12" fill="#72e3a2"/>
  </g>
