    <circle cx="55" cy="340" r="78" fill="#06101b" stroke="#91a9ba" stroke-width="10"/>
    <circle cx="365" cy="340" r="78" fill="#06101b" stroke="#91a9ba" stroke-width="10"/>
    <rect x="54" y="110" width="312" height="250" rx="52" fill="url(#body)" stroke="#b9efff" stroke-width="5" filter="url(#glow)"/>
    <rect x="93" y="152" width="234" height="120" rx="24" fill="#081827" stroke="#62d9ff" stroke-opacity=".65" stroke-width="4"/>
    <circle cx="162" cy="212" r="35" fill="#bdf4ff"/>
    <circle cx="258" cy="212" r="35" fill="#bdf4ff"/>
    <circle cx="162" cy="212" r="15" fill="#07111f"/>
    <circle cx="258" cy="212" r="15" fill="#07111f"/>
    <rect x="172" y="67" width="76" height="55" rx="10" fill="#ffc86b"/>
